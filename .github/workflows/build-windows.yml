name: Build Windows game

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        shell: pwsh
        run: |
          $version = "4.3-stable"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version/Godot_v4.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version/Godot_v4.3-stable_export_templates.tpz" -OutFile templates.tpz
          $templates = "$env:APPDATA\Godot\export_templates\4.3.stable"
          New-Item -ItemType Directory -Force $templates | Out-Null
          Expand-Archive templates.tpz -DestinationPath template_unpack
          Copy-Item "template_unpack\templates\*" $templates -Recurse -Force
          if (-not (Test-Path "$templates\windows_release_x86_64.exe")) {
            throw "Windows export template was not installed."
          }

      - name: Import project
        shell: pwsh
        run: |
          & .\godot\Godot_v4.3-stable_win64_console.exe --headless --editor --path "$PWD" --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot project import failed." }

      - name: Export Windows executable
        shell: pwsh
        run: |
          $output = Join-Path $PWD "build\Minecraftgame.exe"
          New-Item -ItemType Directory -Force (Split-Path $output) | Out-Null
          & .\godot\Godot_v4.3-stable_win64_console.exe --headless --path "$PWD" --verbose --export-release "Windows Desktop" "$output"
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path $output)) {
            Write-Host "Export finished without producing the EXE. Godot export presets:"
            Get-Content export_presets.cfg
            throw "Minecraftgame.exe was not created."
          }
          Get-Item $output | Format-List FullName,Length

      - name: Upload playable game
        uses: actions/upload-artifact@v4
        with:
          name: Minecraftgame-Windows
          path: build/Minecraftgame.exe
          if-no-files-found: error
